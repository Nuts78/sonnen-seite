<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#ffc414">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  html, body { margin: 0; min-height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #eef4f8; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  sonnen-laune-card { display: block; border-radius: 22px; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
  #upd { text-align: center; color: #667; font-size: .95em; margin-top: 10px; }
  #upd.old { color: #a33; }
  #visits { text-align: center; color: #889; font-size: .85em; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <sonnen-laune-card id="card"></sonnen-laune-card>
  <div id="upd">Lade …</div>
  <div id="visits"></div>
</main>
<script src="/card.js"></script>
<script>
  // ha-card gibt es hier nicht – als einfacher Block darstellen
  if (!customElements.get("ha-card")) customElements.define("ha-card", class extends HTMLElement {
    connectedCallback() { this.style.display = "block"; }
  });
  const card = document.getElementById("card");
  const upd = document.getElementById("upd");
  let configured = false, lastOk = 0;

  async function refresh() {
    try {
      const r = await fetch("/api/data", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      if (!configured) { card.setConfig(d.config); configured = true; }
      card.hass = { states: d.states };
      lastOk = Date.now();
      const t = new Date(d.time * 1000);
      upd.className = "";
      upd.textContent = "Stand: " + t.toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
      if (d.visits) {
        const n = (x) => x.toLocaleString("de-AT");
        document.getElementById("visits").textContent = "👀 " + n(d.visits.today) + " Aufrufe heute · " + n(d.visits.total) + " insgesamt";
      }
    } catch (e) {
      if (Date.now() - lastOk > 60000) {
        upd.className = "old";
        upd.textContent = "Keine Verbindung – wird gleich wieder versucht …";
      }
    }
  }
  refresh();
  setInterval(refresh, 10000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
